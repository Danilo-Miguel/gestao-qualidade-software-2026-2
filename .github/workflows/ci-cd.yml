name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes automatizados
        run: pytest tests/

      - name: Subir o servidor em segundo plano
        run: |
          python app.py &
          sleep 2

      - name: Verificar saúde do servidor (monitoramento)
        run: |
          response=$(curl -s http://localhost:5000/health)
          echo "Resposta recebida: $response"
          echo "$response" | grep -q '"status":"ok"' || (echo "Servidor não respondeu corretamente" && exit 1)

      - name: Derrubar o servidor
        run: pkill -f app.py || true